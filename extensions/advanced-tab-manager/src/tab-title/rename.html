<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rename tab title · GoreeCloud Advanced Tab Manager</title>
  <link rel="stylesheet" href="../shared/glaze.css">
  <link rel="stylesheet" href="rename.css">
</head>
<body>
  <main class="rename-shell" aria-labelledby="rename-heading">
    <header class="rename-header">
      <div class="rename-lockup glz-lockup">
        <span class="glz-mark" aria-hidden="true"></span>
        <div class="glz-lockup-copy">
          <p class="eyebrow">GoreeCloud Advanced Tab Manager</p>
          <h1 id="rename-heading">Rename tab title</h1>
        </div>
      </div>
      <p class="intro">Give this tab a short custom name that's easy to spot.</p>
    </header>

    <form id="rename-form" class="rename-card">
      <label for="tab-title">Custom tab title</label>
      <input id="tab-title" name="title" type="text" maxlength="160" autocomplete="off" spellcheck="true" required>
      <p id="page-title" class="page-title"></p>
      <p class="privacy-note">Saved locally with this Firefox tab. No broad site access is requested. Reload or navigation can restore the site title; reopen <strong>Rename tab title…</strong> to reapply this name.</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <button id="restore" type="button" class="secondary">Restore page title</button>
        <span class="action-spacer"></span>
        <button id="cancel" type="button" class="secondary">Cancel</button>
        <button id="save" type="submit" class="primary">Rename</button>
      </div>
    </form>
  </main>
  <script type="module" src="rename.js"></script>
</body>
</html>
