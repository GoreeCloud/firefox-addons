<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoreeCloud Advanced Tab Manager</title>
  <link rel="stylesheet" href="../shared/glaze.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="rules.css">
  <link rel="stylesheet" href="command-palette.css">
</head>
<body>
  <main class="shell">
    <div class="sidebar-chrome">
      <header class="topbar">
        <div class="product-title glz-lockup">
          <span class="glz-mark" aria-hidden="true"></span>
          <div class="glz-lockup-copy">
            <p class="eyebrow">GoreeCloud</p>
            <h1>Advanced Tab Manager</h1>
            <p class="subtitle">Organize this Firefox profile</p>
          </div>
        </div>
        <div class="topbar-actions" aria-label="Advanced Tab Manager actions">
          <button id="open-manager" class="toolbar-button" type="button">Manager</button>
          <button id="save-window" class="toolbar-button primary" type="button">Save</button>
          <button id="refresh" class="toolbar-button" type="button">Refresh</button>
        </div>
      </header>

      <div class="controls">
        <label class="search-field">
          <span class="sr-only">Search tabs and saved items</span>
          <input id="search" type="search" autocomplete="off" placeholder="Search tabs, saved items, and rules…">
        </label>
        <label class="view-field">
          <span class="sr-only">Sidebar view</span>
          <select id="view-mode" aria-label="Sidebar view">
            <option value="tree">Tree view</option>
            <option value="groups">Native groups</option>
            <option value="duplicates">Duplicates</option>
            <option value="saved">Saved items</option>
            <option value="snoozed">Snoozed</option>
            <option value="rules">Rules</option>
          </select>
        </label>
      </div>

      <section id="summary" class="summary" aria-live="polite" aria-label="Current browser state"></section>
    </div>

    <section id="content" class="content" aria-live="polite"></section>
  </main>

  <dialog id="snooze-dialog" class="snooze-dialog" aria-labelledby="snooze-dialog-title">
    <form id="snooze-form" class="snooze-form">
      <header class="snooze-dialog-heading">
        <div>
          <p class="eyebrow">Snooze</p>
          <h2 id="snooze-dialog-title">Choose when to reopen</h2>
          <p id="snooze-dialog-tab" class="snooze-dialog-tab"></p>
        </div>
        <button id="snooze-cancel-x" class="row-action" type="button" aria-label="Cancel snooze scheduling">×</button>
      </header>

      <div class="snooze-presets" aria-label="Snooze time presets">
        <button type="button" data-snooze-preset="hour">In 1 hour</button>
        <button type="button" data-snooze-preset="later-today">Later today</button>
        <button type="button" data-snooze-preset="tomorrow">Tomorrow 9:00 AM</button>
        <button type="button" data-snooze-preset="next-week">Next week 9:00 AM</button>
      </div>

      <label class="snooze-deadline-field" for="snooze-deadline">
        <span>Date and time</span>
        <input id="snooze-deadline" name="deadline" type="datetime-local" required>
      </label>
      <p id="snooze-dialog-error" class="snooze-dialog-error" aria-live="polite"></p>

      <footer class="snooze-dialog-actions">
        <button id="snooze-cancel" type="button">Cancel</button>
        <button id="snooze-submit" class="toolbar-button primary" type="submit">Snooze tab</button>
      </footer>
    </form>
  </dialog>
  <script type="module" src="manager-link.js"></script>
  <script type="module" src="command-palette.js"></script>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
