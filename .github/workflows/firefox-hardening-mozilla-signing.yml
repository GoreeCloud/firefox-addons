name: Firefox Hardening Mozilla Signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firefox-hardening-mozilla-signing.yml'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact candidate
        run: python shared/scripts/package_extension.py firefox-hardening --output-dir dist/candidate
      - name: Verify accepted candidate
        shell: bash
        run: |
          set -euo pipefail
          file="dist/candidate/goreecloud-firefox-hardening-0.1.0.xpi"
          echo "82043d51fafed43635b480f7530a5f5c2ea3ef7bd16a7f79fa2eb62ca63a1151  $file" | sha256sum -c -
          mkdir -p signing-source dist/mozilla
          unzip -q "$file" -d signing-source
      - name: Mozilla unlisted signing
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@10.5.0 sign --source-dir signing-source --artifacts-dir dist/mozilla --channel=unlisted --approval-timeout=900000 --timeout=900000
      - name: Verify signed XPI parity
        shell: bash
        run: |
          set -euo pipefail
          candidate="dist/candidate/goreecloud-firefox-hardening-0.1.0.xpi"
          signed="$(find dist/mozilla -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          test -n "$signed"
          python extensions/firefox-hardening/tests/verify_signed_xpi.py 0.1.0 "$candidate" "$signed"
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Retain signed XPI evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-firefox-hardening-0.1.0-mozilla-signed
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/goreecloud-firefox-hardening-0.1.0-signed.xpi
            dist/signed-sha256.txt
            dist/signed-xpi-parity.json
